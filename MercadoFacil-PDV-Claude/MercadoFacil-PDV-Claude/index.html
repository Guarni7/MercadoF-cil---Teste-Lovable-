      html, body, #root {
        margin: 0;
        min-height: 100%;
        background-color: #f8fafc;
        color: #1e293b;
      }
    </style>

    <!-- Meta Pixel Base Code — arquivo externo (public/pixel-loader.js) para
         script-src não precisar de 'unsafe-inline' na CSP (vercel.json).
         Noscript omitido: ID real via Integrações. -->
    <script src="/pixel-loader.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
